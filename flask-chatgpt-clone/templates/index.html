<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flask Chat Clone</title>
  <style>
    body {
      font-family: Georgia, "Times New Roman", serif;
      background: linear-gradient(160deg, #e8eef5 0%, #f7f3ea 100%);
      margin: 0;
      padding: 2rem;
      color: #1a1a1a;
    }
    h1 { font-size: 1.75rem; margin: 0 0 1rem; }
    #chat-log {
      background: #fff;
      border: 1px solid #c5ced9;
      min-height: 280px;
      max-height: 420px;
      overflow-y: auto;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .msg-user { margin: 0.5rem 0; text-align: right; color: #0b3d5c; }
    .msg-bot { margin: 0.5rem 0; text-align: left; color: #1f3d2a; }
    .msg-user::before { content: "You: "; font-weight: bold; }
    .msg-bot::before { content: "Bot: "; font-weight: bold; }
    #composer { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    #user-input {
      flex: 1;
      min-width: 12rem;
      padding: 0.6rem 0.75rem;
      border: 1px solid #c5ced9;
      font: inherit;
    }
    button {
      padding: 0.6rem 1rem;
      border: 1px solid #0b3d5c;
      background: #0b3d5c;
      color: #fff;
      font: inherit;
      cursor: pointer;
    }
    button.secondary {
      background: #fff;
      color: #0b3d5c;
    }
  </style>
</head>
<body>
  <h1>Flask Chat Clone</h1>
  <div id="chat-log" aria-live="polite"></div>
  <div id="composer">
    <input id="user-input" type="text" placeholder="Type a message" autocomplete="off">
    <button type="button" onclick="sendMessage()">Send</button>
    <button type="button" class="secondary" onclick="resetChat()">Reset</button>
  </div>
  <script>
    function appendMessage(role, text) {
      const log = document.getElementById("chat-log");
      const row = document.createElement("div");
      row.className = role === "user" ? "msg-user" : "msg-bot";
      row.textContent = text;
      log.appendChild(row);
      log.scrollTop = log.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById("user-input");
      const text = input.value.trim();
      if (!text) return;

      appendMessage("user", text);
      input.value = "";

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text }),
        });
        const data = await res.json();
        if (!res.ok) {
          appendMessage("bot", data.error || "Request failed");
          return;
        }
        appendMessage("bot", data.reply || "No reply");
      } catch (err) {
        appendMessage("bot", "Network error talking to /chat");
      }
    }

    async function resetChat() {
      try {
        await fetch("/reset", { method: "POST" });
      } catch (err) {
        /* still clear the visible log so the learner can restart the check */
      }
      document.getElementById("chat-log").innerHTML = "";
    }

    document.getElementById("user-input").addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
