<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>{% block title %}Quiz Generator{% endblock %}</title>
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
      <a class="navbar-brand" href="{% url 'quiz_app:generate' %}">Quiz Generator</a>
      <a class="btn btn-outline-light" href="{% url 'quiz_app:history' %}">My Quizzes</a>
    </div>
  </nav>
  <main class="container">{% block content %}{% endblock %}</main>
</body>
</html>
