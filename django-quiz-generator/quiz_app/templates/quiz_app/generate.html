<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Quiz generator</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><main class="container py-5"><h1>Generate a quiz</h1>
<p class="text-muted">Paste study material, then save the generated quiz.</p>
{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
<form method="post" class="card card-body">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary">Generate quiz</button></form>
<a class="btn btn-link px-0" href="{% url 'history' %}">My quizzes</a></main></body></html>
